<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Contact Form</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --form-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .form-container {
            background: var(--form-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3);
            animation: fadeIn 0.6s ease-out;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 15px;
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 8px;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- NEW POPUP STYLES --- */
        .popup-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background: var(--form-bg);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 320px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
            color: var(--text);
            animation: fadeIn 0.3s ease-out;
        }

        .popup-content p {
            font-size: 16px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .popup-content button {
            width: auto;
            padding: 10px 24px;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Let's connect</h2>
        <p class="subtitle">Fill out the details below and we'll be in touch.</p>
        
        <!-- 
          GOOGLE FORMS INTEGRATION PLACEHOLDER 
          1. Replace action URL with your Google Form "formResponse" URL.
          2. Update the "name" attributes below to match Google's "entry.123456" IDs.
          3. Remove the JavaScript at the bottom once your backend is live.
        -->
        <form id="contactForm" action="YOUR_GOOGLE_FORM_URL_HERE" method="POST">
            <div class="input-group">
                <label for="name">Full Name</label>
                <!-- Placeholder name="entry.XXXXXX" -->
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <!-- Placeholder name="entry.YYYYYY" -->
                <input type="email" id="email" name="email" placeholder="john@example.com" required>
            </div>

            <div class="input-group">
                <label for="service">What are you looking for?</label>
                <!-- Placeholder name="entry.ZZZZZZ" -->
                <select id="service" name="service" required>
                    <option value="" disabled selected hidden>Choose an option</option>
                    <option value="web-design">Web Design</option>
                    <option value="development">Development</option>
                    <option value="marketing">Marketing</option>
                </select>
            </div>

            <div class="input-group">
                <label for="message">Message</label>
                <!-- Placeholder name="entry.AAAAAA" -->
                <textarea id="message" name="message" placeholder="Tell us about your project..." required></textarea>
            </div>

            <button type="submit">Submit Request</button>
        </form>
    </div>

    <!-- --- NEW POPUP HTML --- -->
    <div class="popup-overlay" id="statusPopup">
        <div class="popup-content">
            <p>Forms Currently not accepting responses.</p>
            <button onclick="document.getElementById('statusPopup').style.display='none'">Close</button>
        </div>
    </div>

    <!-- --- NEW JAVASCRIPT FOR POPUP --- -->
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            // Prevent the form from submitting normally
            e.preventDefault(); 
            
            // Show the custom popup by changing its display style to flex
            document.getElementById('statusPopup').style.display = 'flex';
        });
    </script>

</body>
</html>
